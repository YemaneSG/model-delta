app = "model-delta"
primary_region = "dfw"

[build]
  dockerfile = "showcase-api/Dockerfile.public"

[env]
  APP_ENV = "public"
  MODEL_ROOT = "/app/models"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "75s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

# OPERATIONAL PROTOCOL
# Demo sprint (e.g., active interviews): keep min_machines_running = 1 (~$7-14/month)
# Between interview seasons: fly scale count 0 (pauses machine, $0/month)
# Night before any demo: fly scale count 1
# Rollback: fly releases → fly deploy --image <previous-image-ref>
