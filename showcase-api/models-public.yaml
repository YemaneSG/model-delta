# Model registry — PUBLIC Fly.io deploy
# Uses synthesized proxy models only — no real SLB enterprise data.
# CI uses this file instead of models.yaml when building the public image.
# registry.py resolves: Path(os.environ["MODEL_ROOT"]) / model["path"] / model["checkpoint"]

models:
  # Real SLB models — disabled in public build
  - id: tfidf-v3
    label: "TF-IDF v3 (baseline)"
    type: sklearn
    path: models/v3
    checkpoint: null
    active: false
    color: indigo
    metrics:
      pf_top1: 0.788
      tech_top1: 0.661
      brand_top1: 0.529
      toolname_top1: 0.818
    memory_mb: 50

  - id: modernbert-pf-v1
    label: "ModernBERT PF"
    type: modernbert
    head: product_family
    path: slm/models/pf
    checkpoint: checkpoint-966
    active: false
    color: amber
    metrics:
      pf_top1: 0.859
    memory_mb: 620

  - id: modernbert-tech-v1
    label: "ModernBERT TECH"
    type: modernbert
    head: technology
    path: slm/models/tech
    checkpoint: checkpoint-1932
    active: false
    color: green
    metrics:
      tech_top1: 0.765
    memory_mb: 620

  - id: modernbert-brand-v1
    label: "ModernBERT BRAND"
    type: modernbert
    head: brand
    path: slm/models/brand
    checkpoint: checkpoint-2312
    active: false
    color: pink
    metrics:
      brand_top1: 0.803
    memory_mb: 620

  # Synthesized proxy models — active in public build
  - id: tfidf-synth-v1
    label: "TF-IDF proxy (synthetic)"
    type: sklearn
    path: models/synth_v1
    checkpoint: null
    active: true
    color: slate
    metrics:
      pf_top1: 0.924
      tech_top1: 0.387
      brand_top1: 0.223
      toolname_top1: 0.138
    memory_mb: 50

  - id: modernbert-pf-synth-v1
    label: "ModernBERT PF proxy"
    type: modernbert
    head: product_family
    path: slm/models/synthesized/pf
    checkpoint: checkpoint-14994
    active: true
    color: sky
    metrics:
      pf_top1: 0.933
    memory_mb: 620

  - id: modernbert-tech-synth-v1
    label: "ModernBERT TECH proxy"
    type: modernbert
    head: technology
    path: slm/models/synthesized/tech
    checkpoint: checkpoint-14994
    active: true
    color: teal
    metrics:
      tech_top1: 0.551
    memory_mb: 620

  - id: modernbert-brand-synth-v1
    label: "ModernBERT BRAND proxy"
    type: modernbert
    head: brand
    path: slm/models/synthesized/brand
    checkpoint: checkpoint-19712
    active: true
    color: rose
    metrics:
      brand_top1: 0.245
    memory_mb: 620
